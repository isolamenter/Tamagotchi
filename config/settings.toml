# 运行参数配置。
# 放数值和开关类配置；不要放密钥、部署路径或大段 prompt。

[memory]
# 最近这么多条消息永远不压缩。
buffer_keep = 80
# 未压缩消息数超过这个值后触发后台压缩。
compress_threshold = 200
# RAG 召回时按相关性打分最多扫描这么多张最近卡片。
recall_scan_max = 2000
# 有其他人物候选时，用一次小型语义路由理解无@称呼/代词；失败安全降级。
identity_resolve_enabled = true
identity_resolve_timeout_sec = 8

[reply]
# 连续 @ 消息合并窗口（秒）。在该窗口内到达的同一群连续 @ 消息会合并处理，不漏答。
debounce_sec = 1.5

[meme]
# 候选复核超时后只发文字；梗图没有时间冷却或回复间隔。
review_timeout_sec = 15

[observer]
# 旁听（observer）消息缓冲，批量写入。
flush_max_count = 50

[llm]
# 普通回复 / 主动发言的 JSON 输出 token 上限。
reply_max_tokens = 1200
# 采样温度
reply_temperature = 0.5
autonomous_temperature = 0.5
# 日记 / 梦境还可能附带 image_prompt，JSON 输出需要更大上限。
scheduled_max_tokens = 1000
# 记忆压缩输出（一组卡片 JSON）的 token 上限。
compress_max_tokens = 2000

[style_retrieval]
# 语义分达到这个门槛，或当前消息直接命中关键词时，才允许注入风格语料。
semantic_threshold = 0.62
example_card_semantic_threshold = 0.62
second_semantic_threshold = 0.68
second_max_gap = 0.05
keyword_bonus = 0.04
keyword_bonus_cap = 0.12
context_messages = 2
query_max_chars = 1500
embedding_batch_size = 50
init_timeout_sec = 30

[autonomous]
# 心跳间隔（秒）
tick_interval_sec = 600
# 主动发言基础冷却（秒）——缩短为 10 分钟（600 秒）
cooldown_sec = 600
# 若前次主动发言无人响应，冷静期延长为 30 分钟（1800 秒）
unanswered_cooldown_sec = 1800
# 本地时区偏移（默认上海 +8）
timezone_offset_hours = 8.0
# 定时事件发送窗口锁定时间：日记 19:00，梦境 10:00
quiet_start_hour = 19
quiet_end_hour = 10
# 周末静默（用于控制主动事件是否在周末发送）
quiet_weekends = false
# 梦境/日记窗口补发宽限（秒）
scheduled_grace_sec = 3600
# 触发主动发言评估所需的最少新人类旁听消息数
proactive_min_new_msgs = 1
# 对外发言只考虑仍在进行的讨论，不把维护心跳长度当活跃证据。
fresh_activity_sec = 180
# 事件驱动主动插嘴开关与防抖（群友发消息时轻量快速判定并现场接梗）
event_interject_enabled = true
event_interject_debounce_sec = 2.0
# 直接回复（@ 对话）后的主动插嘴冷静期（秒）——防连珠炮，1分钟后群友热聊即可正常接梗
reply_cooldown_sec = 60.0

[card]
# 卡片展示总开关（用于梦境配图与日记等富文本展示）
enabled = true
# 梦境插图生成超时（秒）
image_timeout_sec = 120

[consolidation]
# 内部每日整理，独立于对外日记/梦境；无新消息不调用，不发群消息。
enabled = true
hour = 19
max_messages = 300
max_context_chars = 64000
max_output_tokens = 6000
max_calls_per_day = 4
retry_sec = 900
timeout_sec = 90
