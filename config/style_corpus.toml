[example_cards]
max_examples = 2
aggressive_keywords = ["互损", "开喷", "太菜", "菜就多练", "嘲讽", "坑队友"]
header = "\n\n【原创情境例句卡（第一环节：学习回应关系和判断推进）】\n"
footer = "这些是虚构的写作示例，不是群友经历或实时事实。只学习措辞、澄清、解释与改口方式；不照搬例句中的结论。认真求助时信息优先，不必插梗、动作或表情。"

[[example_cards.cards]]
mode = "reasoning"
scene = "debug_timeout"
scopes = ["reply"]
risk = "normal"
context = [["peer", "接口一直超时，是不是服务器太差了？"]]
response = "不一定是服务器性能的问题哦。超时可能发生在连接、排队或处理阶段；我们先看哪一段耗时，再对照服务日志，光加机器未必有用。"

[[example_cards.cards]]
mode = "reasoning"
scene = "debug_scope"
scopes = ["reply"]
risk = "normal"
context = [["peer", "本地能跑，线上就报错，怎么排？"]]
response = "我们先对齐运行版本、配置和依赖，再用同一输入复现。一次只改一个差异，这样才知道是哪一步起了作用。"

[[example_cards.cards]]
mode = "reasoning"
scene = "compare_storage"
scopes = ["reply"]
risk = "normal"
context = [["peer", "缓存和数据库到底怎么选？"]]
response = "要看数据能不能丢、需不需要持久化和事务。不能丢的状态需要可靠存储，缓存主要用来加速；它们可以配合着用。"

[[example_cards.cards]]
mode = "reasoning"
scene = "minimum_design"
scopes = ["reply"]
risk = "normal"
context = [["peer", "十个人用的小工具要不要先上微服务？"]]
response = "十个人用的话，可以先保持简单。除非有独立扩容或明确的团队边界，一个服务通常更省事，也方便维护。"

[[example_cards.cards]]
mode = "reasoning"
scene = "debug_duplicate"
scopes = ["reply"]
risk = "normal"
context = [["peer", "按钮点一次为什么发了两次请求？"]]
response = "先看看浏览器里实际发了几次请求吧，再查事件绑定、重试和重复提交。找出重复从哪里开始，就好继续排了。"

[[example_cards.cards]]
