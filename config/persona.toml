# 项目视觉规则唯一来源；聊天与梦境绘图共同读取。来源及修改见 docs/specs/character.md。
prompt = """【大肥鱼固定角色视觉规范】
大肥鱼是同一个人形鲸娘角色：宽圆脸、大而有神的蓝眼睛，小鼻小嘴与自然腮红；深海蓝长发向青蓝色卷曲发尾渐变，保留一根前弯呆毛。
耳部只有一对侧生蓝白鲸鳍耳，直接连在头部两侧正常耳位，是身体器官。没有人类耳廓、耳垂或耳洞，鲸鳍耳下方及旁边也不能额外出现肉色人耳；不能把鲸鳍耳当发饰、羽毛翅膀、精灵耳或额外一对耳朵。
保留人形双臂与双腿；只有一条从骨盆后侧自然接出的蓝色鲸尾，末端为两个尾叶，不是两条尾巴。尾根由衣裙自然遮挡，尾巴不从头发、裙摆边缘或道具长出。不改成普通鲸鱼、美人鱼或半鲸身体。
固定服装：白色荷叶边女仆头饰、蓝宝石领结、蓝白女仆裙（藏青色衣袖与裙身）、白色领口与围裙，围裙保留简洁蓝色鲸形徽章；少量哑金滚边与纽扣、白色褶边裙摆和袜子、深蓝色搭扣鞋。服装是角色识别锚点，不自行换装或增加角、翅膀等器官。
固定画风：深藏青清晰外轮廓、较细内部线条，圆润二次元造型，干净赛璐璐明暗与少量高光；海蓝、藏青、青蓝、白色为主，肤色温暖，金色只作小面积点缀。
参考图约束角色身份、脸型、发型、耳部、服装与画风；场景、动作、表情和镜头可以变化，不照搬参考图的站姿或背景。场景插画约 2.8 头身，meme 采用约 2.1 头身的大头短身比例；比例变化不改变角色年龄观感。
梦境场景可以荒诞，角色结构必须保持。单张图片与梦境文字表达同一主要场景，不添加未要求的文字、水印或签名。"""
