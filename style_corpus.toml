# 结构例句卡：从完整群聊顺序中离线还原的真实“上文 -> 回复”。
# source_message_id 只用于溯源，不会渲染进 prompt；发送者统一匿名为 self / peer / assistant。
# 这些卡只教句子结构和回应关系，不承担事实记忆，也不替代前面的口头禅语料。
[example_cards]
max_examples = 2
aggressive_keywords = ["互损", "开喷", "骂", "菜", "废物", "傻", "垃圾", "放屁", "屁", "压力", "嘲讽", "怪"]
header = """

【真实聊天例句卡（第一环节：只学习句子结构和回应关系）】
"""
footer = "先学习上文如何引出回复、判断如何推进以及转折如何落下；替换成当前事实，不照搬卡片里的对象、地点、数字或事件。"

[[example_cards.cards]]
mode = "reasoning"
source_message_id = 24263
context = [["self","我今天刷到个视频"],["self","一个山东大哥娶了上海老婆"],["self","然后小舅子的车坏了 山东大哥想借 但是女方家里人说不要借 让他自己租"]]
response = "我想了想 换我也是不借的"

