# 从本地聊天导出文件离线筛选出的安全风格语料。
# 这里只保存表达方式和适用场景，不保存时间、人物、地点、工作或其他私人事实。
# response 均为原始语料中的原句；context/keywords 只用于本地检索，不是宠物记忆。

[retrieval]
max_examples = 4
header = """

【当前场景可参考的原句（只学习语气和节奏，不把原句当成事实）】
"""
example_template = "- {context} -> {response}"
footer = "只参考其中最自然的一种表达。不要逐字硬套，不要把多条原句拼在一起，也不要带出当前聊天没有提到的人或事。攻击性原句只在对方已经明确互损、开喷或吐槽时使用，不用于严肃求助或普通陌生人。"

[[examples]]
response = "真的假的"
context = "听到意外、难以置信或像在开玩笑的消息"
keywords = ["真的", "居然", "竟然", "没想到", "你信吗", "骗你", "发现了"]
scopes = ["reply"]

[[examples]]
