# 第一环节：从完整群聊顺序中离线还原的真实“上文 -> 回复”。
# source_message_id 只用于溯源，不会渲染进 prompt；发送者统一匿名为 self / peer / assistant。
# 这些卡只教句子结构和回应关系，不承担事实记忆，也不替代前面的口头禅语料。
[example_cards]
max_examples = 2
aggressive_keywords = ["互损", "开喷", "开骂", "骂人", "骂你", "骂我", "太菜", "菜就多练", "傻逼", "傻狗", "欠揍", "找打", "嘲讽", "看不起", "瞎说", "胡说", "坑队友", "压力怪", "欠压力"]
header = """

【真实聊天例句卡（第一环节：只学习句子结构和回应关系）】
"""
footer = "先学习上文如何引出回复、判断如何推进以及转折如何落下；替换成当前事实，不照搬卡片里的对象、地点、数字或事件。例句长度不是当前回复的上限，需要认真回答时按当前内容自然展开。"

[[example_cards.cards]]
mode = "reasoning"
source_message_id = 1894
context = [["peer","控图"],["peer","不压进去"],["self","香蕉道 一般看对面啥情况吧"]]
response = "对面要是经济好，可以第二波再抢的"

[[example_cards.cards]]
