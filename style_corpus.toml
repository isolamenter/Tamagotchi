# 从本地合并聊天导出和只读消息快照离线筛选出的安全风格语料。
# 第二环节的 100 个 [[examples]] 是口头禅组；相近原句放在 variants 中，命中后按 source_count 加权随机选一句。
# 第一环节的 100 张 [[example_cards.cards]] 保留匿名化真实上文和回复，用于学习判断推进与句子结构。
# 两层语料只保存表达方式和回应关系，不把旧人物、地点、数字、工作或单次事件当成当前事实。
# 原始聊天导出和数据库快照不参与运行，也不应提交。

[retrieval]
corpus_version = 4
max_examples = 2
header = """

【口头禅语料（第二环节：只学习短反应和说话节奏）】
"""
example_template = "- {context} -> {response}"
footer = "每个场景只会随机取一条口头禅。不要拼接多条，也不要用口头禅承担事实和完整推理；口头禅只影响措辞和反应节奏，不决定整条回复的篇幅。句子结构以第一环节的例句卡为准。攻击性原句只在对方已经明确互损、开喷或吐槽时使用。"

# 第二环节：从目标说话者的两个连续账号合并语料中整理出的 100 组口头禅。
