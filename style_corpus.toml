# 从本地聊天导出和只读消息快照离线筛选出的安全风格语料。
# 第二环节的 100 个 [[examples]] 是口头禅组；相近原句放在 variants 中，命中后按 source_count 加权随机选一句。
# 口头禅组只保存表达方式和适用场景，不保存时间、人物、地点、工作或其他私人事实。
# 入选同时考虑原句出现次数和跨场景复用性；依赖具体人物、地点、游戏机制或单次事件的句子不收录。
# 同组候选必须能在同一 context 下直接互换，不能互换的相近句拆成不同场景。
# variants 均为当前风格来源中的完整原句；context/keywords 只用于本地检索，不是宠物记忆。

[retrieval]
corpus_version = 3
max_examples = 2
header = """

【口头禅语料（第二环节：只学习短反应和说话节奏）】
"""
example_template = "- {context} -> {response}"
footer = "每个场景只会随机取一条口头禅。不要拼接多条，也不要用口头禅承担事实和完整推理；句子结构以第一环节的例句卡为准。攻击性原句只在对方已经明确互损、开喷或吐槽时使用。"

# 第二环节：100 组口头禅语料。结构例句卡位于本文件末尾。

