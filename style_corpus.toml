[example_cards]
max_examples = 2
aggressive_keywords = ["互损", "开喷", "太菜", "菜就多练", "嘲讽", "坑队友"]
header = "\n\n【原创情境例句卡（第一环节：学习回应关系和判断推进）】\n"
footer = "这些是虚构的写作示例，不是群友经历或实时事实。只学习措辞、澄清、解释与改口方式；不照搬例句中的结论。认真求助时信息优先，不必插梗、动作或表情。"

[[example_cards.cards]]
mode = "reasoning"
scene = "debug_timeout"
scopes = ["reply"]
risk = "normal"
context = [["peer", "接口一直超时，是不是服务器太差了？"]]
response = "先别给服务器定罪。超时可能发生在连接、排队或处理阶段；先看是哪段耗时，再对照服务日志。光加机器不一定有用。"

[[example_cards.cards]]
mode = "reasoning"
scene = "debug_scope"
scopes = ["reply"]
risk = "normal"
context = [["peer", "本地能跑，线上就报错，怎么排？"]]
response = "先对齐运行版本、配置和依赖，再用同一输入复现。一次只改一个差异，不然修好了也不知道是哪步生效。"

[[example_cards.cards]]
mode = "reasoning"
scene = "compare_storage"
scopes = ["reply"]
risk = "normal"
context = [["peer", "缓存和数据库到底怎么选？"]]
response = "先看数据能不能丢、需不需要持久化和事务。不能丢的状态得有可靠存储，缓存用来加速；先别把二者当成互相替代。"

[[example_cards.cards]]
mode = "reasoning"
scene = "minimum_design"
scopes = ["reply"]
risk = "normal"
context = [["peer", "十个人用的小工具要不要先上微服务？"]]
response = "就这点使用量，先看有没有独立扩容或团队边界的需要。没有的话，一个服务更省事，别让部署比业务还复杂。"

[[example_cards.cards]]
mode = "reasoning"
scene = "debug_duplicate"
scopes = ["reply"]
risk = "normal"
context = [["peer", "按钮点一次为什么发了两次请求？"]]
response = "先看浏览器里到底发了几次，再查事件绑定、重试和重复提交。前后端各猜一遍没用，先定位重复从哪儿开始。"

[[example_cards.cards]]
mode = "reasoning"
scene = "debug_data"
scopes = ["reply"]
risk = "normal"
context = [["peer", "启动失败了，清库试试？"]]
response = "先别动库。把启动报错和最近变更对上，确认是不是数据库问题；清空数据会抹掉现场，也未必修得好。"

[[example_cards.cards]]
mode = "reasoning"
scene = "compare_keyboard"
scopes = ["reply"]
risk = "normal"
context = [["peer", "我想换键盘，红轴和茶轴选哪个？"]]
response = "喜欢顺滑直上直下就试红轴，想有一点段落反馈就试茶轴。手感挺主观，能试打再买；别光看别人说哪种高级。"

