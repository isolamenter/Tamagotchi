# 电子宠物运行参数配置。
# 放数值和开关类配置；不要放密钥、部署路径或大段 prompt。

[memory]
# 最近这么多条消息永远不压缩。
# 接入全群消息 + RAG 卡片后，verbatim 窗口可以再放大，让最近上下文更厚。
buffer_keep = 80
# 未压缩消息数超过这个值后触发后台压缩。
compress_threshold = 200
# RAG 召回时按相关性打分最多扫描这么多张最近卡片（防 CPU 开销过大）。
# 超过这个数的更老卡片只能落到 recency 兜底路径，进不了相关性打分。
recall_scan_max = 2000

[reply]
# 群里被 @ 后，两次正式 LLM 回复之间的最小间隔（秒）。
# 间隔内的 @ 消息照常记进记忆（is_observer=0），下次正式回复时宠物能看到，
# 但不会逐条触发 LLM 回复。设 0 = 关闭节流（每次 @ 都回）。
min_interval_sec = 10

[observer]
# 旁听（observer）消息不再逐条落库：先缓冲在进程内，每个 autonomous tick
# （见 [autonomous].tick_interval_sec）批量写入，下一条 direct 消息到来时也会先 flush。
# 这里是单只宠物缓冲条数的安全上限，超过则立刻 flush，避免进程内存无界增长。
flush_max_count = 50

[llm]
# 普通回复 / 主动发言的 JSON 输出 token 上限。
reply_max_tokens = 400
# 日记 / 梦境要写 150-300 字中文，外加 JSON 外壳，需要更大上限，
# 否则会被截断导致 JSON 解析失败、整条定时事件被静默丢弃。
scheduled_max_tokens = 1000
# 记忆压缩输出（一组卡片 JSON）的 token 上限。
compress_max_tokens = 2000
# 交互卡片按钮被点击后，后台生成那句反馈台词的 token 上限（纯文本一句话，不需要大）。
card_reply_max_tokens = 150

[state]

[state.initial]
# 0-100 浮点：hunger 0=饱 100=极饿；mood/energy/curiosity/affection 0=糟 100=满。
hunger = 20.0
mood = 80.0
energy = 80.0
curiosity = 60.0
affection = 30.0

# 兼容旧 state_delta 工具函数的单次变化上限；普通对话不再写入 state，卡片使用自己的确定性 delta。
[state.delta_clamp]
hunger = 30
mood = 25
energy = 25
curiosity = 20
affection = 12

# 衰减模型：每个维度向 baseline 指数收敛（v = baseline + (v-baseline)*exp(-rate*h)），
# 没人互动时漂回中段而不是钉死在极端档。rate = 每小时收敛速率常数（半衰期 ≈ 0.693/rate 小时）。
[state.decay_active]
# 清醒时段的收敛目标 / 速率。
hunger    = { baseline = 95.0,  rate = 0.20 }  # 没人喂会慢慢饿到接近极饿
mood      = { baseline = 50.0,  rate = 0.22 }  # 没互动回落到平淡中段
energy    = { baseline = 35.0,  rate = 0.18 }  # 清醒时精力往略低档漂
curiosity = { baseline = 45.0,  rate = 0.25 }  # 探索欲淡回中段，需要互动重新点燃
affection = { baseline = 40.0,  rate = 0.04 }  # 对群的感情漂得很慢

[state.decay_quiet]
# 静默时段（睡觉时间）的收敛目标 / 速率。
hunger    = { baseline = 80.0,  rate = 0.06 }  # 睡觉代谢慢，饿得慢
mood      = { baseline = 55.0,  rate = 0.05 }  # 睡觉时心情基本稳定
energy    = { baseline = 100.0, rate = 0.45 }  # 睡觉快速回血
curiosity = { baseline = 50.0,  rate = 0.0  }  # 睡觉不衰减探索欲
affection = { baseline = 40.0,  rate = 0.0  }  # 睡觉不衰减感情

# 极端档 / 高档 / 低档判定（不在范围内 = 中段，state_render 直接不渲染该维度）。
[state.bands.hunger]
extreme_high = 85
high = 60

[state.bands.mood]
extreme_low = 15
low = 40
high = 80

[state.bands.energy]
extreme_low = 15
low = 40
high = 80

[state.bands.curiosity]
high = 80
low = 25

[state.bands.affection]
high = 75
low = 20

[gameplay]
# 状态玩法：阈值触发需求事件，卡片按钮按规则确定性结算五维状态。
enabled = true
need_ttl_sec = 7200

[gameplay.need_thresholds]
hungry = 80
sleepy = 25
sad = 30
bored = 30
lonely = 25

[autonomous]
# 心跳间隔（测试期 1 min；生产建议 600）。
tick_interval_sec = 600
# 普通主动发言冷却（测试期 0；生产建议 14400，即 4h）。
cooldown_sec = 3600
# 静默时段用的本地时区偏移（默认上海 +8）。
timezone_offset_hours = 8.0
# 休息时段：本地时间落在此区间内不普通主动发言。支持跨午夜（start > end）。
# 当前 19:00 休息 → 次日 10:00 起床。日记锁定在 quiet_start、梦境锁定在 quiet_end。
quiet_start_hour = 19
quiet_end_hour = 10
# 周末整天也算休息时间；自动冒泡、梦境、日记都会停掉，@ 时只回睡眠文案。
quiet_weekends = true
# 状态没触发时，每 tick 自发说话的概率。
spontaneous_prob = 0.50

[autonomous.trigger_thresholds]
# hunger >= 此值 -> 主动抱怨饿。
hunger = 85.0
# mood <= 此值 -> 主动发情绪。
mood = 15.0
# energy <= 此值 -> 主动说要睡。
energy = 15.0
# curiosity <= 此值 -> 主动想找人玩。
curiosity = 20.0
# affection <= 此值 -> 主动想求关注。
affection = 15.0

[card]
# 交互卡片总开关。作用于「主动发言」（宠物自己冒泡）和「梦境 / 日记」定时事件；
# @ 回复始终是纯文本，不受这里影响。
# false = 主动发言 + 梦境 / 日记都退回纯文本。
enabled = true
# 状态进度条的格子数。
bar_width = 10
# 同一个人点过任意按钮后，再点（任何按钮）的最小间隔（秒），防单人连点；0 = 不限。
# 冷却是 per-user 的：A 点过一下后冷却内不能再点，但 B 不受影响，可继续照料。
action_cooldown_sec = 60
# 卡片按钮从发出起多久后失效（秒），过期后点击只回 toast、不改 state。
# 防止昨天的梦境 / 日记卡一直能点。计时从发卡那刻算，不随点击续期。
button_ttl_sec = 1800
# 卡片文本日志最多累积多少条反馈台词：多人点击时台词逐条向下追加（不整段刷新），
# 超出这个条数就丢掉最旧的，避免卡片无限变高。
card_log_max_lines = 6
# 一张卡片最多显示几个按钮。
max_buttons = 3
# 所有状态维度都在中段（宠物没有明显需求）时，兜底随机挑这些按钮里的，保证卡片总有东西可点。
default_actions = ["play", "pet"]
# 梦境插图：调图像模型生成一张图的超时（秒）。需在 .env 配 IMAGE_MODEL 才会生成；
# 生成 / 上传任一步失败都会安静回退成纯文字梦境卡。
image_timeout_sec = 120

# 每个互动按钮的运行数值。展示文案（按钮名 / 反馈语）在 prompts.toml [card]。
# need_dim + need_side 决定按钮何时浮现：该维度进入对应方向的非中段档位才显示。
#   need_side = "high" -> 维度进入 high / extreme_high 档时浮现（如饿了才出现投喂）
#   need_side = "low"  -> 维度进入 low / extreme_low 档时浮现
# delta 是点击后套用的「确定性」状态变化，不经过 LLM，不受 [state].delta_clamp 限制。
[card.actions.feed]
need_dim = "hunger"
need_side = "high"
delta = { hunger = -35, mood = 3 }

[card.actions.rest]
need_dim = "energy"
need_side = "low"
delta = { energy = 30, hunger = 5 }

[card.actions.soothe]
need_dim = "mood"
need_side = "low"
delta = { mood = 25, affection = 3 }

[card.actions.play]
need_dim = "curiosity"
need_side = "low"
delta = { curiosity = 25, mood = 8, energy = -8, hunger = 5 }

[card.actions.pet]
need_dim = "affection"
need_side = "low"
delta = { affection = 20, mood = 5 }

# 日记 / 梦境卡片的固定按钮。没有 need_dim/need_side，不会出现在主动发言卡片上，
# 只在 prompts.toml [[scheduled_events]] 的 card_action 指定时随对应卡片出现。
[card.actions.goodnight]
delta = { mood = 8, affection = 5 }

[card.actions.goodmorning]
delta = { mood = 8, curiosity = 8, affection = 5 }
